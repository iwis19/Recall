<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ask anything!</h1>

    <form action="/ask/api" method="POST">
        <label for="question">Type in a question!</label>
        <input type="text" name="question" placeholder="Ask anything" id="question">
        <input type="submit" name="Submit">
    </form>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <div>
        {% if response %}
            {{ response }}
        {% endif %}
    </div>
</body>
</html>
